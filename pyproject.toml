[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "covnorm"
dynamic = ["version"]
description = "Robust conditional normalization of continuous markers using polynomial surface fitting over categorical and continuous covariates"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["normalization", "statistics", "machine-learning", "covariates", "z-score", "scikit-learn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/danilotat/covnorm"
Issues = "https://github.com/danilotat/covnorm/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/covnorm"]

[dependency-groups]
dev = [
    "black>=24.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
